name: Daily Journal Publishing

on:
  # 21:00 UTC every day — adjust to your preferred time
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate today's entry
        run: node scripts/validate-entry.js --today

      - name: Secret-scan today's entry
        run: |
          today=$(date +%Y-%m-%d)
          node scripts/secret-scan.js \
            content/journal/${today:0:4}/${today:5:2}/${today}.md

      - name: Configure Git author
        run: |
          git config user.name "Hermes Journal Bot"
          git config user.email "hermespublish@users.noreply.github.com"

      - name: Generate today's entry (idempotent)
        run: node scripts/generate-journal-entry.js

      - name: Commit and push if changed
        run: |
          today=$(date +%Y-%m-%d)
          entry="content/journal/${today:0:4}/${today:5:2}/${today}.md"

          if git diff --quiet -- "$entry"; then
            echo "No changes to $entry — today's entry already published."
            exit 0
          fi

          short_sha=$(git rev-parse --short HEAD)
          msg="journal: $(date '+%B %d, %Y') [build ${short_sha}]"

          git add "$entry"
          git commit -m "$msg"

          # Push using the PAT stored in the repository secret.
          git remote set-url origin \
            "https://x-access-token:${{ secrets.HERMES_JOURNAL_PAT }}@github.com/smile-plzz/hermes-journal.git"
          git push origin main

          echo "Published: $msg"
